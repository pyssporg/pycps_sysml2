name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist

      - name: Check the built artifacts
        run: |
          set -eu
          ls -l dist
          wheels="$(find dist -name '*.whl' | wc -l)"
          test "$wheels" -eq 1
          wheel="$(find dist -name '*.whl')"
          version="$(basename "$wheel" | cut -d- -f2)"
          test "$version" != "0.0.0"
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet "$wheel"
          /tmp/verify/bin/python -c "import pycps_sysml2, sysmlpy; print(pycps_sysml2.__version__)"

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/')
        # The project version is dynamic; read it from the package, never from
        # pyproject.toml (there is no [project].version there).
        run: |
          set -eu
          version="$(python -c "import sys; sys.path.insert(0, 'src'); import pycps_sysml2; print(pycps_sysml2.__version__)")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
